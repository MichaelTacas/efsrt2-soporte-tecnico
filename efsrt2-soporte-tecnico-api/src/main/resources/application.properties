spring.application.name=efsrt2-soporte-tecnico-api

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/soporte_tecnico_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true