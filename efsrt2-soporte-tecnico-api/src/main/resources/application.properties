spring.application.name=efsrt2-soporte-tecnico-api

# ==============================
# MYSQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/soporte_tecnico_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# SEGURIDAD JWT
# ==============================

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:efsrt2-soporte-tecnico}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# ==============================
# ADMINISTRADOR INICIAL
# ==============================

app.admin.email=${ADMIN_EMAIL:admin@grzasociados.com}
app.admin.password=${ADMIN_PASSWORD:}